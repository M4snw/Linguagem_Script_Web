<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calculadora.css">
    <title>Calculadora de Média</title>
</head>
<body>
    <main>
        <h1>Calculadora de Média</h1>

        <form id="calculadora-media">
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" step="0.1" min="0" max="10" required>

            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" step="0.1" min="0" max="10" required>

            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" step="0.1" min="0" max="10" required>

            <button type="submit">Calcular Média</button>
        </form>

        <p id="resultado-media"></p>
    </main>
    <script src="calculadora.js"></script>
</body>
</html>
